<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icon/32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon/16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icon/128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO meta 写死在这里，作为模板兜底，不依赖 JS。
      预渲染的路径（/、/announcements、/credits、/prototype）会由 @unhead/vue
      按页面覆写这些 title/description/og —— 爬虫拿到的就是成品 HTML。
      这里保留一份是因为 CSR 外壳页（/register、/forgot-password、/nomu/login）
      仍然只有这个模板，搜索引擎和 JS 关闭的用户至少能读到标题与描述。
      文案与 src/locales/zh-CN.ts 的 noonTool.meta 保持一致，改文案时两边同步。
    -->
    <title>Nomu:一款易用的 Noon 插件</title>
    <meta
      name="description"
      content="Nomu 是一款 Chrome 浏览器扩展,帮你从 1688、淘宝/天猫、京东采集商品,自动整理标题、价格和图片,翻译成英文和阿拉伯语,再逐件发布到 Noon 阿联酋和沙特站。多店铺集中管理、任务面板、店铺间复制、AI 类目推荐均已内置;注册一个免费账号即可登录使用,店铺设置默认保存在本地。"
    />
    <meta name="keywords" content="Nomu, 1688, 淘宝上架, 京东上架, Noon 上架, Noon UAE, Noon Saudi, 浏览器扩展" />

    <!--
      canonical 与 hreflang 不在这里：SSG 会把这份模板复制到每个预渲染页面，
      写死等于告诉搜索引擎「公告页的规范版本是首页」。它们随页面走，在
      LandingView.vue / AnnouncementsView.vue / CreditsView.vue 的 useHead 里。
    -->

    <!-- 社交分享卡片:微信、Telegram、Slack 等都读 og:* -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nomu" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="Nomu:一款易用的 Noon 插件" />
    <meta
      property="og:description"
      content="Nomu 是一款 Chrome 浏览器扩展,帮你从 1688、淘宝/天猫、京东采集商品,自动整理标题、价格和图片,翻译成英文和阿拉伯语,再逐件发布到 Noon 阿联酋和沙特站。"
    />
    <meta property="og:url" content="https://nomu.kanocifer.chat/" />
    <!--
      分享图单独出一张 1200×630：og 的事实标准比例是 1.91:1（Facebook / 微信 /
      Slack），Twitter summary_large_image 是 2:1。页面里那张 poster 是 1400×560
      的 2.5:1，两边都不匹配，而且它是 1MB 的 PNG，当分享图必然加载慢。
      这张是它的 1200×630 等比留白版，62KB。
    -->
    <meta property="og:image" content="https://nomu.kanocifer.chat/screens/og-1200x630.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nomu:一款易用的 Noon 插件" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nomu:一款易用的 Noon 插件" />
    <meta
      name="twitter:description"
      content="Nomu 是一款 Chrome 浏览器扩展,帮你从 1688、淘宝/天猫、京东采集商品,翻译后逐件发布到 Noon 阿联酋和沙特站。"
    />
    <meta name="twitter:image" content="https://nomu.kanocifer.chat/screens/og-1200x630.jpg" />
    <meta name="twitter:image:alt" content="Nomu:一款易用的 Noon 插件" />

    <!--
      关掉 JS 的兜底：入场动效（composables/useReveal）在 SSR 输出里把二十几个内容块
      写成内联 style="opacity:0;transform:translateY(14px)"，等 motion 接手才显现。
      Googlebot 会跑 JS 没事，但关 JS 的用户、不少 AI 爬虫、阅读器的抓取快照看到的是
      一张空白页。这一行在 <noscript> 里，只有关掉 JS 时才生效，把内联初始态抹掉。
      动效本身不动 —— 它仍然是 JS 打开时的默认行为。
    -->
    <noscript>
      <style>
        [style*='opacity:0'] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
