<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icon/32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icon/16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icon/128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO meta 静态写死在这里,不依赖 JS。
      原因是本站是纯 CSR:爬虫拿到的初始 HTML 里如果只有空 <div id="app">,
      就等于一个没有任何标题和描述的空白页。LandingView.vue 里的 useHead 只在
      JS 执行后生效,百度这类 JS 渲染能力弱的爬虫基本读不到。
      文案与 src/locales/zh-CN.ts 的 noonTool.meta 保持一致,改文案时两边同步。
    -->
    <title>Nomu:一款易用的 Noon 插件</title>
    <meta
      name="description"
      content="Nomu 是一款 Chrome 浏览器扩展,帮你从 1688、淘宝/天猫、京东采集商品,自动整理标题、价格和图片,翻译成英文和阿拉伯语,再逐件发布到 Noon 阿联酋和沙特站。多店铺集中管理、任务面板、店铺间复制、AI 类目推荐均已内置;注册一个免费账号即可登录使用,店铺设置默认保存在本地。"
    />
    <meta name="keywords" content="Nomu, 1688, 淘宝上架, 京东上架, Noon 上架, Noon UAE, Noon Saudi, 浏览器扩展" />
    <link rel="canonical" href="https://nomu.kanocifer.chat/" />

    <!-- hreflang:告诉搜索引擎 / 与 /en/ 是同一页面的两种语言版本 -->
    <link rel="alternate" hreflang="zh-CN" href="https://nomu.kanocifer.chat/" />
    <link rel="alternate" hreflang="en" href="https://nomu.kanocifer.chat/en/" />
    <link rel="alternate" hreflang="x-default" href="https://nomu.kanocifer.chat/" />

    <!-- 社交分享卡片:微信、Telegram、Slack 等都读 og:* -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nomu" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Nomu:一款易用的 Noon 插件" />
    <meta
      property="og:description"
      content="Nomu 是一款 Chrome 浏览器扩展,帮你从 1688、淘宝/天猫、京东采集商品,自动整理标题、价格和图片,翻译成英文和阿拉伯语,再逐件发布到 Noon 阿联酋和沙特站。"
    />
    <meta property="og:url" content="https://nomu.kanocifer.chat/" />
    <meta property="og:image" content="https://nomu.kanocifer.chat/screens/poster.png" />
    <meta property="og:image:width" content="1400" />
    <meta property="og:image:height" content="560" />
    <meta property="og:image:alt" content="Nomu:一款易用的 Noon 插件" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nomu:一款易用的 Noon 插件" />
    <meta
      name="twitter:description"
      content="Nomu 是一款 Chrome 浏览器扩展,帮你从 1688、淘宝/天猫、京东采集商品,翻译后逐件发布到 Noon 阿联酋和沙特站。"
    />
    <meta name="twitter:image" content="https://nomu.kanocifer.chat/screens/poster.png" />

    <!--
      SoftwareApplication 结构化数据:让搜索结果有机会出富媒体展现(应用卡片)。
      注意这不直接提升排名,也不解决收录问题,收录靠的是上面的静态 meta + 预渲染正文。
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Nomu",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Chrome",
        "url": "https://nomu.kanocifer.chat/",
        "image": "https://nomu.kanocifer.chat/screens/poster.png",
        "inLanguage": ["zh-CN", "en"],
        "description": "Nomu 是一款 Chrome 浏览器扩展,帮你从 1688、淘宝/天猫、京东采集商品,自动整理标题、价格和图片,翻译成英文和阿拉伯语,再逐件发布到 Noon 阿联酋和沙特站。"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
