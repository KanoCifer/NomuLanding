# Nomu 站点 nginx 片段 —— 修 soft-404 + 配合 SSG
#
# 背景（2026-10-04 实测）：这段一直没合进服务器，线上 nginx 对**任何**路径都返回
# 200 + 首页 HTML —— 包括 /en/、/sitemap.xml 和随便编的 URL。后果有两个：
#   1. 软 404：搜索引擎认为每个 URL 都有效，浪费抓取预算；
#   2. /sitemap.xml 返回的是 text/html，Google 根本没法解析站点地图。
# 落地页已改用 vite-ssg 预渲染（见 vite.config.ts 的 PRERENDER_ROUTES），
# 产物里 /、/announcements、/credits 已经是真实目录，配合下面的 try_files
# 就能既出内容又真 404。
#
# 应用方式：把下面的 location 块合并进 nomu.kanocifer.chat 的 server {}，
# 注意先删除站点里原有的 SPA location 块（重复会导致 nginx 启动失败），
# 合完 `nginx -t` 通过再 reload。
#
# 站点根目录（由 deploy.sh rsync 决定）：
#   /home/kano/Nomu/Landing     → https://nomu.kanocifer.chat/
#   /home/kano/NomuDocs/docs/   → https://nomu.kanocifer.chat/docs/  （GitHub Actions 部署）

# ---------- 文档站：SSG，路径即文件，不存在就该真 404 ----------
location /docs/ {
    alias /home/kano/NomuDocs/docs/;
    try_files $uri $uri/ $uri.html =404;
    # sitemap 每次构建都重写，不要长缓存，否则新页面进不了索引
    location = /docs/sitemap.xml {
        alias /home/kano/NomuDocs/docs/sitemap.xml;
        add_header Cache-Control "public, max-age=3600";
    }
}

# ---------- CSR 外壳页 ----------
# 这三条路径没有预渲染（依赖 query 参数或属于交易页，静态化没收益），
# 需要回退到 dist/index.html 这个 CSR 外壳。
# nomu/login 必须保留 —— 后端 magicLoginLinkPathFor() 拼出的魔法登录链接
# （Server-Go: internal/service/user/magic_login.go）就落在这里，删掉会导致邮件里的链接全部失效。
location ~ ^/(register|forgot-password|nomu/login)/?$ {
    root /home/kano/Nomu/Landing;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

# ---------- 预渲染页面 + 静态资源 ----------
# vite-ssg 把 / 、/announcements 、/credits 烤成了 dist/<path>/index.html，
# 所以这三个路径是真实目录，$uri/ 命中目录索引直接出 HTML —— 不需要回退。
# 其余路径一律真 404，不再伪造成功。
location / {
    root /home/kano/Nomu/Landing;
    try_files $uri $uri/ =404;

    # 每次构建都重写，不要长缓存，否则新页面进不了索引
    location = /sitemap.xml {
        root /home/kano/Nomu/Landing;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|mp4|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# /prototype 是 /credits 的旧别名，已从路由里删掉。站外如果有指向它的旧链接，
# 想要一条 301 而不是硬 404 的话，把下面这段取消注释（放进 server {} 即可）：
#
# location = /prototype {
#     return 301 /credits;
# }
